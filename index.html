<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord RH – Démo</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2433; --muted: #6b7280;
    --accent: #3b5bdb; --accent-2: #12b886; --warn: #f08c00; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151f; --card: #1a2030; --text: #e6e9f0; --muted: #9aa3b5; --border: #2a3245; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Aptos, "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { color: var(--muted); margin-top: 4px; }
  .badge { background: var(--warn); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .kpi .label { color: var(--muted); font-size: .85rem; }
  .kpi .value { font-size: 1.9rem; font-weight: 700; margin: 6px 0 2px; }
  .kpi .delta { font-size: .85rem; }
  .up { color: var(--accent-2); } .down { color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  svg { width: 100%; height: auto; display: block; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; margin: 8px 0; font-size: .9rem; }
  .bar { height: 12px; border-radius: 6px; background: var(--accent); }
  .track { background: var(--border); border-radius: 6px; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tableau de bord RH</h1>
      <div class="sub">Société Exemple · Données au 31/10/2026</div>
    </div>
    <span class="badge">Données fictives</span>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2>Effectif mensuel</h2>
      <svg id="chart" viewBox="0 0 400 200" role="img" aria-label="Évolution de l'effectif"></svg>
    </div>
    <div class="card">
      <h2>Répartition par service</h2>
      <div id="bars"></div>
    </div>
  </section>

  <footer>Démo hébergée sur GitHub Pages · YOUMANIO</footer>
</div>

<script>
  // ---- Données fictives : modifiez ici ----
  const kpis = [
    { label: "Effectif total", value: "148", delta: "+4 vs mois dernier", dir: "up" },
    { label: "Turnover (12 mois)", value: "11,2 %", delta: "-1,3 pt", dir: "up" },
    { label: "Absentéisme", value: "4,8 %", delta: "+0,4 pt", dir: "down" },
    { label: "Time-to-hire", value: "38 j", delta: "-5 j", dir: "up" }
  ];
  const months = ["Nov","Déc","Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct"];
  const headcount = [131,132,134,135,137,139,140,141,141,143,144,148];
  const services = [["Commercial",42],["Production",38],["Support",27],["Finance",16],["RH",9],["Direction",16]];

  // ---- Indicateurs ----
  document.getElementById("kpis").innerHTML = kpis.map(k => `
    <div class="card kpi">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}</div>
      <div class="delta ${k.dir}">${k.delta}</div>
    </div>`).join("");

  // ---- Courbe ----
  const svg = document.getElementById("chart");
  const W = 400, H = 200, pad = 28;
  const min = Math.min(...headcount) - 3, max = Math.max(...headcount) + 3;
  const x = i => pad + i * (W - 2 * pad) / (headcount.length - 1);
  const y = v => H - pad - (v - min) / (max - min) * (H - 2 * pad);
  const pts = headcount.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  svg.innerHTML = `
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    ${headcount.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--accent)"><title>${months[i]} : ${v}</title></circle>`).join("")}
    ${months.map((m, i) => `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${m}</text>`).join("")}
    <text x="${x(11)}" y="${y(148) - 10}" font-size="12" text-anchor="end" fill="var(--text)" font-weight="700">148</text>`;

  // ---- Barres ----
  const top = Math.max(...services.map(s => s[1]));
  document.getElementById("bars").innerHTML = services.map(([name, n]) => `
    <div class="bar-row">
      <span>${name}</span>
      <div class="track"><div class="bar" style="width:${n / top * 100}%"></div></div>
      <span>${n}</span>
    </div>`).join("");
</script>
</body>
</html>
